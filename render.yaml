# Render blueprint: backend API (Python). Secrets are set in the Render dashboard, not here.
services:
  - type: web
    name: ziventra-talent-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATA_MODE
        value: mongo
      - key: SN_MONGODB_URI
        sync: false
      - key: AI_MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Varsha
      - key: FRONTEND_ORIGINS
        sync: false
